name: Renderer checks

on:
  push:
    branches: [master]
    paths:
      - 'renderer/**'
      - 'shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - '.github/workflows/test-renderer.yml'
  pull_request:
    branches: [master]
    paths:
      - 'renderer/**'
      - 'shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - '.github/workflows/test-renderer.yml'

jobs:
  test:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - run: pnpm install --frozen-lockfile --filter @kanwas/renderer...
      - run: pnpm --filter shared build
      - run: pnpm --filter @kanwas/renderer typecheck
      - run: pnpm --filter @kanwas/renderer lint
      - run: pnpm --filter @kanwas/renderer test
      - run: pnpm --filter @kanwas/renderer build
