name: Desktop source and package checks

on:
  push:
    branches: [master]
    paths:
      - 'desktop/**'
      - 'local-runtime/**'
      - 'renderer/**'
      - 'yjs-core/**'
      - 'shared/**'
      - 'patches/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/test-desktop.yml'
  pull_request:
    branches: [master]
    paths:
      - 'desktop/**'
      - 'local-runtime/**'
      - 'renderer/**'
      - 'yjs-core/**'
      - 'shared/**'
      - 'patches/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/test-desktop.yml'

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Install virtual display for Linux smoke test
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes xvfb

      - run: pnpm install --frozen-lockfile --filter @kanwas/desktop... --filter @kanwas/renderer...
      - run: pnpm --filter @kanwas/desktop check
      - run: pnpm --filter @kanwas/local-runtime test
      - name: Package unpacked application
        run: pnpm --filter @kanwas/desktop exec electron-builder --dir --publish never
      - name: Smoke test packaged application
        run: pnpm --filter @kanwas/desktop smoke:package
