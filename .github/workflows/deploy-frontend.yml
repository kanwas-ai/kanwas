name: Deploy Frontend

on:
  workflow_run:
    workflows: ['Frontend Tests']
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        type: choice
        default: 'staging'
        options: [staging, production, seo]

concurrency:
  group: deploy-frontend-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  build-and-deploy-staging:
    name: Build & Deploy → Staging
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    runs-on: ubuntu-latest
    environment: staging
    permissions: { contents: read, packages: write }

    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:staging
          build-args: |
            VITE_MODE=staging
            API_HOST=staging-api.kanwas.ai

      - run: npm install -g @railway/cli
      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          echo "🚀 Deploying frontend to staging..."
          railway redeploy --service frontend --yes
          echo "✓ Deploy triggered"

  build-and-deploy-production:
    name: Build & Deploy → Production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: read, packages: write }

    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:production
            ghcr.io/${{ github.repository }}/frontend:latest
          build-args: |
            VITE_MODE=production
            ADMIN_PATH=${{ vars.ADMIN_PATH }}

      - run: npm install -g @railway/cli
      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "🚀 Deploying frontend to production..."
          railway redeploy --service frontend --yes
          echo "✓ Deploy triggered"

  build-and-deploy-seo:
    name: Build & Deploy → SEO
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'seo'
    runs-on: ubuntu-latest
    environment: seo
    permissions: { contents: read, packages: write }

    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:seo
          build-args: |
            VITE_MODE=seo
            API_HOST=seo-api.kanwas.ai

      - run: npm install -g @railway/cli
      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_SEO }}
        run: |
          echo "🚀 Deploying frontend to SEO..."
          railway redeploy --service frontend --yes
          echo "✓ Deploy triggered"
