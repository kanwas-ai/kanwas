# Octopus Review: free, AI-powered code review for open source.
# Indexes the codebase, understands project patterns, and posts inline
# review comments on every pull request. No signup or API key required
# for public repositories. Learn more: https://octopus-review.ai/docs/github-action

name: Octopus Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review
    runs-on: ubuntu-latest
    steps:
      - uses: octopusreview/action@v1
